services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pcos_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pcos_health
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pcos_health"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
