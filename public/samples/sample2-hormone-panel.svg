<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <rect width="800" height="1000" fill="#ffffff" />
  <!-- Watermark -->
  <text x="400" y="500" font-family="Helvetica, Arial, sans-serif" font-size="90" font-weight="bold" fill="#f8fafc" text-anchor="middle" transform="rotate(-30, 400, 500)">SAMPLE REPORT - DEMO ONLY</text>
  
  <!-- Header -->
  <rect x="0" y="0" width="800" height="90" fill="#0284c7" />
  <text x="40" y="45" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">DR LAL PATHLABS LIMITED</text>
  <text x="40" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e0f2fe">National Reference Laboratory, Sector 18, Block E, Rohini, New Delhi</text>
  <text x="760" y="55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="end">DAY 3 HORMONAL PANEL</text>

  <!-- Patient Details Box -->
  <rect x="40" y="110" width="720" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="60" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Patient Name:</text>
  <text x="170" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Priya Sharma</text>
  <text x="420" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Sample Date:</text>
  <text x="530" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">20-Jan-2026 08:30 AM</text>

  <text x="60" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Age / Gender:</text>
  <text x="170" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">26 Years / Female</text>
  <text x="420" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Cycle Timing:</text>
  <text x="530" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">Day 3 of Natural Menstrual Cycle</text>

  <text x="60" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Lab ID / Barcode:</text>
  <text x="170" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">LAL-HOR-44921</text>
  <text x="420" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Referred By:</text>
  <text x="530" y="200" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0284c7">Dr. Ananya Sen, MD (OB-GYN)</text>

  <!-- Table Header -->
  <rect x="40" y="240" width="720" height="35" fill="#f1f5f9" />
  <text x="60" y="263" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">INVESTIGATION</text>
  <text x="320" y="263" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">OBSERVED VALUE</text>
  <text x="470" y="263" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">UNIT</text>
  <text x="600" y="263" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">REFERENCE RANGE</text>

  <!-- Test 1: LH -->
  <line x1="40" y1="310" x2="760" y2="310" stroke="#f1f5f9" stroke-width="1" />
  <text x="60" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">Luteinizing Hormone (LH) (ECLIA) *</text>
  <text x="320" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0284c7">12.4</text>
  <text x="470" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">mIU/mL</text>
  <text x="600" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">2.4 - 12.6 (Follicular)</text>

  <!-- Test 2: FSH -->
  <line x1="40" y1="355" x2="760" y2="355" stroke="#f1f5f9" stroke-width="1" />
  <text x="60" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Follicle Stimulating Hormone (FSH)</text>
  <text x="320" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">4.8</text>
  <text x="470" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">mIU/mL</text>
  <text x="600" y="340" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">3.5 - 12.5 (Follicular)</text>

  <!-- Test 3: LH:FSH Ratio -->
  <line x1="40" y1="400" x2="760" y2="400" stroke="#f1f5f9" stroke-width="1" />
  <text x="60" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#be123c">Calculated LH : FSH Ratio *</text>
  <text x="320" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#be123c">2.58</text>
  <text x="470" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">ratio</text>
  <text x="600" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#be123c">Optimal &lt; 1.5 (&gt; 2 indicative)</text>

  <!-- Test 4: Free Testosterone -->
  <line x1="40" y1="445" x2="760" y2="445" stroke="#f1f5f9" stroke-width="1" />
  <text x="60" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#be123c">Free Testosterone (ELISA) *</text>
  <text x="320" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#be123c">4.2</text>
  <text x="470" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">pg/mL</text>
  <text x="600" y="430" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#be123c">0.1 - 3.1 (Elevated)</text>

  <!-- Test 5: Serum Prolactin -->
  <line x1="40" y1="490" x2="760" y2="490" stroke="#f1f5f9" stroke-width="1" />
  <text x="60" y="475" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Serum Prolactin (CLIA)</text>
  <text x="320" y="475" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">14.2</text>
  <text x="470" y="475" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">ng/mL</text>
  <text x="600" y="475" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">4.8 - 23.3 (Normal)</text>

  <!-- Box -->
  <rect x="40" y="550" width="720" height="150" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
  <text x="60" y="580" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#0369a1">HORMONAL ANALYSIS SUMMARY:</text>
  <text x="60" y="605" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0c4a6e">• LH to FSH ratio of 2.58 reflects classic neuroendocrine pulsatility disturbance typical of PCOS.</text>
  <text x="60" y="630" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0c4a6e">• Elevated Free Testosterone (4.2 pg/mL) provides biochemical evidence for hyperandrogenism.</text>
  <text x="60" y="655" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0c4a6e">• Prolactin is within normal limits, ruling out hyperprolactinemia as the cause of oligomenorrhea.</text>

  <!-- Signatures -->
  <text x="100" y="870" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">DR. N. VERMA, MD</text>
  <text x="100" y="888" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">Biochemist &amp; Endocrinologist</text>
  
  <text x="660" y="870" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="end">DR. S. CHOPRA, MD</text>
  <text x="660" y="888" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Medical Director</text>

  <!-- Footer -->
  <line x1="40" y1="920" x2="760" y2="920" stroke="#cbd5e1" stroke-width="1" />
  <text x="400" y="945" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">DEMO SAMPLE REPORT • GENERATED FOR RESEARCH SIMULATION • NOT A MEDICAL DIAGNOSIS</text>
</svg>
